<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B74F7"/>
      <stop offset="1" stop-color="#2443C4"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0B1E6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- handle -->
    <path d="M392 372 V312 a108 108 0 0 1 216 0 V372" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <!-- bag body -->
    <path d="M276 330 H724 a40 40 0 0 1 39.8 36 l32 384 a56 56 0 0 1 -55.8 60.6 H260 a56 56 0 0 1 -55.8 -60.6 l32 -384 A40 40 0 0 1 276 330 Z" fill="url(#bag)"/>
  </g>

  <!-- upload arrow -->
  <g fill="none" stroke="#2C4FD8" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 690 V470"/>
    <path d="M404 560 L500 464 L596 560"/>
  </g>
  <!-- tray line -->
  <path d="M380 740 H620" stroke="#2C4FD8" stroke-width="40" stroke-linecap="round" opacity="0.35"/>
</svg>
